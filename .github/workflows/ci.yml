name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Temporary A5 runner validation. Keep the normal CI matrix on main.
jobs:
  st-onboard-a5:
    uses: ./.github/workflows/_st-npu-a5.yml
    with:
      runs_on: '["self-hosted","a5"]'
