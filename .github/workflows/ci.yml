name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  st-onboard-a2a3-227:
    uses: ./.github/workflows/_st-npu-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3","227"]'
      include_dfx_smokes: true

  st-onboard-a2a3-chuangzhi:
    uses: ./.github/workflows/_st-npu-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3","chuangzhi"]'
      include_dfx_smokes: true
