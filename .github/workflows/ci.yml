name: CI compile parallelism probe

# Temporary compile-only benchmark. No device allocation or cache upload.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: [self-hosted, Linux, ARM64, a2a3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a2a3 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Compile full a2a3 scene-test corpus with 64 workers
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          .venv/bin/python -m simpler_setup.tools.scene_test_compile examples tests/st --platform a2a3 --exclude-level 4 --require-pto-isa --compile-workers 64 -q --manual include

      - name: Compile DeepSeek standalone kernels with 64 workers
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          runtimes=$(.venv/bin/python -c "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a2a3')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a2a3/$runtime/deepseek_v4_flash_decode/main.py" --platform a2a3 --compile-only --compile-workers 64
          done
