name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ut-a5:
    uses: ./.github/workflows/_ut-npu-a5.yml
    with:
      runs_on: '["self-hosted","a5"]'
      include_cann_examples: false
