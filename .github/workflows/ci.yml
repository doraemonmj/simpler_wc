name: Bootstrap chuangzhi runner user environment

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-chuangzhi-user-env:
    runs-on: [self-hosted, a2a3, chuangzhi]
    timeout-minutes: 60
    steps:
      - name: Checkout bootstrap script
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install CPU torch and A3 dependencies in runner user site
        shell: bash
        run: bash tools/bootstrap_chuangzhi_user_env.sh
