name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      runs_on: '["ubuntu-latest"]'

  pre-commit:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_pre-commit.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      runs_on: '["ubuntu-latest"]'
      setup_variant: github

  ut:
    name: UT cache probe
    uses: ./.github/workflows/ut-ccache-warm.yml

  st-framework-eager-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a2a3
      runs_on: '["self-hosted","a2a3"]'

  st-framework-eager-a5:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a5
      runs_on: '["self-hosted","a5"]'
