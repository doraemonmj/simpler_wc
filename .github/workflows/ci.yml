name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ut:
    uses: ./.github/workflows/_ut-no-hardware.yml
    with:
      runs_on: '["macos-latest"]'
      setup_variant: github
      python_version: "3.10"
