name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  chuangzhi-proxy-process-check:
    runs-on: [self-hosted, a2a3, chuangzhi]
    timeout-minutes: 5
    steps:
      - name: Check proxy and related processes
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner: ${RUNNER_NAME}; host: $(hostname)"
          echo 'Related processes (PID, command name, state):'
          ps -eo pid=,comm=,stat= | awk '$2 ~ /^(Runner\.Listener|Runner\.Worker|clash|mihomo|sing-box|privoxy|tinyproxy|v2ray|xray|squid)$/ { print }'

          proxy_url="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-http://127.0.0.1:7892}}}}"
          read -r proxy_host proxy_port < <(PROXY_URL="$proxy_url" python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          proxy = urlsplit(os.environ['PROXY_URL'])
          if not proxy.hostname or not proxy.port:
              raise SystemExit('Proxy URL has no host or port')
          print(proxy.hostname, proxy.port)
          PY
          )
          echo "Proxy endpoint: ${proxy_host}:${proxy_port}"

          failures=0
          if python3 - "$proxy_host" "$proxy_port" <<'PY'
          import socket
          import sys

          with socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=3):
              print('Proxy TCP port: reachable')
          PY
          then
            :
          else
            echo 'Proxy TCP port: unreachable'
            failures=$((failures + 1))
          fi

          if command -v ss >/dev/null 2>&1; then
            echo 'Proxy port listeners (process names and PIDs):'
            ss -H -ltnp "sport = :${proxy_port}" || true
          else
            echo 'ss is unavailable; curl checks will test the proxy endpoint.'
          fi

          for target in https://github.com/ https://pypi.org/simple/ https://download.pytorch.org/whl/cpu/; do
            echo "Checking ${target} through the proxy"
            if curl --silent --show-error --fail --head --location \
              --connect-timeout 15 --max-time 35 --proxy "$proxy_url" \
              --output /dev/null --write-out 'HTTP %{http_code}; connect %{time_connect}s; TLS %{time_appconnect}s; total %{time_total}s\n' "$target"; then
              :
            else
              failures=$((failures + 1))
            fi
          done
          echo "Failed checks: ${failures}"
          test "$failures" -eq 0
