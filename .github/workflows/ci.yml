name: CI Network Provisioning Experiment

permissions:
  contents: read

on:
  pull_request:
    branches: [ci/downselect-sim-scenes]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-setup:
    name: compiler-setup (${{ matrix.variant }}, sample-${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-update, direct-ppa]
        sample: [1, 2, 3]

    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Provision GCC 15 toolchain
        env:
          VARIANT: ${{ matrix.variant }}
          EXPECTED_PPA_FINGERPRINT: 60C317803A41BA51845E371A1E9377A2BA9EF27F
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          total_started=$SECONDS

          case "$VARIANT" in
            baseline)
              repo_started=$SECONDS
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              repo_seconds=$((SECONDS - repo_started))
              apt_options=()
              ;;
            no-update)
              repo_started=$SECONDS
              sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test
              repo_seconds=$((SECONDS - repo_started))
              apt_options=()
              ;;
            direct-ppa)
              repo_started=$SECONDS
              key_file="$RUNNER_TEMP/ubuntu-toolchain-r-test.asc"
              curl --fail --silent --show-error --location \
                --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
                "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${EXPECTED_PPA_FINGERPRINT}" \
                --output "$key_file"
              actual_fingerprint="$(
                gpg --show-keys --with-colons "$key_file" |
                  awk -F: '$1 == "fpr" { print $10; exit }'
              )"
              if [[ "$actual_fingerprint" != "$EXPECTED_PPA_FINGERPRINT" ]]; then
                echo "::error::unexpected PPA signing key: $actual_fingerprint"
                exit 1
              fi
              sudo install -d -m 0755 /etc/apt/keyrings
              sudo gpg --batch --yes --dearmor \
                --output /etc/apt/keyrings/ubuntu-toolchain-r-test.gpg "$key_file"
              source /etc/os-release
              printf '%s\n' \
                'Types: deb' \
                'URIs: https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu/' \
                "Suites: $VERSION_CODENAME" \
                'Components: main' \
                'Signed-By: /etc/apt/keyrings/ubuntu-toolchain-r-test.gpg' |
                sudo tee /etc/apt/sources.list.d/ubuntu-toolchain-r-test.sources >/dev/null
              repo_seconds=$((SECONDS - repo_started))
              apt_options=(
                -o Acquire::Retries=3
                -o Acquire::http::Timeout=20
                -o Acquire::https::Timeout=20
              )
              ;;
            *)
              echo "::error::unknown provisioning variant: $VARIANT"
              exit 2
              ;;
          esac

          update_started=$SECONDS
          sudo apt-get "${apt_options[@]}" update
          update_seconds=$((SECONDS - update_started))

          install_started=$SECONDS
          sudo apt-get "${apt_options[@]}" install -y ninja-build
          sudo apt-get "${apt_options[@]}" install -y g++-15 || \
            sudo apt-get "${apt_options[@]}" install -y g++
          if ! command -v g++-15 >/dev/null 2>&1; then
            sudo ln -s "$(command -v g++)" /usr/local/bin/g++-15
          fi
          sudo apt-get "${apt_options[@]}" install -y graphviz
          install_seconds=$((SECONDS - install_started))
          total_seconds=$((SECONDS - total_started))

          command -v gcc-15
          command -v g++-15
          command -v ninja
          command -v dot
          gcc-15 --version | head -1
          g++-15 --version | head -1

          {
            echo "### $VARIANT / sample ${{ matrix.sample }}"
            echo
            echo '| phase | seconds |'
            echo '| --- | ---: |'
            echo "| repository setup | $repo_seconds |"
            echo "| explicit apt update | $update_seconds |"
            echo "| package install | $install_seconds |"
            echo "| total provisioning | $total_seconds |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build a5sim package
        uses: ./.github/actions/setup-venv
        with:
          install-torch: "false"
          build-packages: "scikit-build-core nanobind cmake>=3.15"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a5sim ."

      - name: Verify package and runtime artifacts
        run: |
          .venv/bin/python -c 'import simpler; import simpler_setup'
          test -f build/lib/a5/sim/host_build_graph/libhost_runtime.so
          test -f build/lib/a5/sim/host_build_graph/libaicpu_kernel.so
          test -f build/lib/a5/sim/host_build_graph/libaicore_kernel.so
          test -f build/lib/a5/sim/tensormap_and_ringbuffer/libhost_runtime.so
          test -f build/lib/a5/sim/tensormap_and_ringbuffer/libaicpu_kernel.so
          test -f build/lib/a5/sim/tensormap_and_ringbuffer/libaicore_kernel.so
