name: CI · joined DFX Sim repro

permissions:
  contents: read

on:
  pull_request:
    branches: [ci/issue-2851-ubuntu24-baseline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  st-sim-a2a3:
    uses: ./.github/workflows/_st-sim-a2a3.yml
    with:
      runs_on: '["ubuntu-24.04"]'
      setup_variant: github
      include_dfx_smokes: false
      manual_mode: exclude
      python_version: "3.10"

  st-sim-a5:
    uses: ./.github/workflows/_st-sim-a5.yml
    with:
      runs_on: '["ubuntu-24.04"]'
      setup_variant: github
      include_dfx_smokes: false
      manual_mode: exclude
      python_version: "3.10"
