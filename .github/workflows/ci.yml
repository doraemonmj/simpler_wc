name: CI cold C++ UT generator comparison

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: generator (${{ matrix.os }}, ${{ matrix.order }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        order: [forward, reverse]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up C++ compiler and Ninja
        uses: ./.github/actions/setup-gcc-15

      - name: Install GoogleTest on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          required-packages: libgtest-dev
          install-timeout-seconds: "240"

      - name: Install GoogleTest on macOS
        if: runner.os == 'macOS'
        run: brew install googletest

      - name: Install sim package needed by the CMake include contract
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'scikit-build-core>=0.10.0' 'nanobind>=2.0.0,<3' 'cmake>=3.20'
          pip install --no-build-isolation \
            --config-settings=build.targets=build_package_sim -e '.[test]'

      - name: Compare fresh full C++ UT builds
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS $(uname -m)"
          if [ "$RUNNER_OS" = Linux ]; then
            echo "available_cpus=$(nproc)"
            lscpu | grep -E 'Model name:|CPU\(s\):'
            variants=(make4 ninja4)
          else
            echo "available_cpus=$(sysctl -n hw.logicalcpu)"
            sysctl -n machdep.cpu.brand_string || true
            variants=(make4 ninja4 ninja3)
          fi
          if [ "$ORDER" = reverse ]; then
            reversed=()
            for ((i=${#variants[@]}-1; i>=0; i--)); do
              reversed+=("${variants[i]}")
            done
            variants=("${reversed[@]}")
          fi
          for variant in "${variants[@]}"; do
            generator='Unix Makefiles'
            parallel=4
            if [[ "$variant" == ninja* ]]; then
              generator=Ninja
            fi
            if [ "$variant" = ninja3 ]; then
              parallel=3
            fi
            build_dir="$RUNNER_TEMP/ut-$variant"
            cmake -G "$generator" -S tests/ut/cpp -B "$build_dir" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            commands=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' \
              "$build_dir/compile_commands.json")
            echo "BENCH $variant compile_commands=$commands parallel=$parallel"
            echo "BENCH $variant build-start"
            /usr/bin/time -p cmake --build "$build_dir" --parallel "$parallel"
            echo "BENCH $variant build-done"
          done
