name: CI cold C++ UT source comparison

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: source (${{ matrix.os }}, ${{ matrix.order }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        order: [baseline-first, variant-first]
    steps:
      - name: Checkout PR head and comparison history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up C++ compiler
        uses: ./.github/actions/setup-gcc-15

      - name: Install GoogleTest on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          required-packages: libgtest-dev
          install-timeout-seconds: "240"

      - name: Install GoogleTest on macOS
        if: runner.os == 'macOS'
        run: brew install googletest

      - name: Install sim package needed by the CMake include contract
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'scikit-build-core>=0.10.0' 'nanobind>=2.0.0,<3' 'cmake>=3.20'
          pip install --no-build-isolation \
            --config-settings=build.targets=build_package_sim -e '.[test]'

      - name: Compare fresh full C++ UT builds
        env:
          OLD_SHA: 4432569baa75e6ab5c2aa92627ab0d84b3bd4c94
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS $(uname -m)"
          if [ "$RUNNER_OS" = Linux ]; then
            echo "available_cpus=$(nproc)"
            lscpu | grep -E 'Model name:|CPU\(s\):'
          else
            echo "available_cpus=$(sysctl -n hw.logicalcpu)"
            sysctl -n machdep.cpu.brand_string || true
          fi
          source_file=tests/ut/cpp/common/platform/CMakeLists.txt
          cp "$source_file" "$RUNNER_TEMP/new-platform-CMakeLists.txt"
          git show "$OLD_SHA:$source_file" > "$RUNNER_TEMP/old-platform-CMakeLists.txt"
          trap 'cp "$RUNNER_TEMP/new-platform-CMakeLists.txt" "$source_file"' EXIT

          if [ "$ORDER" = baseline-first ]; then
            variants=(old new)
          else
            variants=(new old)
          fi
          for variant in "${variants[@]}"; do
            cp "$RUNNER_TEMP/$variant-platform-CMakeLists.txt" "$source_file"
            build_dir="$RUNNER_TEMP/ut-$variant"
            cmake -G 'Unix Makefiles' -S tests/ut/cpp -B "$build_dir" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            commands=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' \
              "$build_dir/compile_commands.json")
            echo "BENCH $variant compile_commands=$commands"
            df -h "$RUNNER_TEMP"
            echo "BENCH $variant build-start"
            /usr/bin/time -p cmake --build "$build_dir" --parallel 4
            echo "BENCH $variant build-done"
            du -sh "$build_dir"
            if [ "$variant" = new ] && [ "$ORDER" = baseline-first ] && [ "$RUNNER_OS" = macOS ]; then
              ctest --test-dir "$build_dir" -LE requires_hardware -j4 \
                --output-on-failure --timeout 300
              python tests/lint/check_ut_cpp_stub_linkage.py --build-dir "$build_dir"
            fi
            rm -rf "$build_dir"
            df -h "$RUNNER_TEMP"
          done
