name: macOS targeted validation

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-ut-and-a2a3sim:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "5000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5

      - name: Set up C++ compiler
        uses: ./.github/actions/setup-gcc-15
        with:
          install-graphviz: "true"

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up a2a3sim environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.15"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a2a3sim .[test]"

      - name: Run affected macOS unit test
        run: |
          .venv/bin/python -m pytest \
            tests/ut/py/test_worker/test_host_worker.py::TestUnreclaimedDeviceStateIsNeverSilent::test_a5_comm_init_child_reports_comm_get_window_size \
            -v

      - name: Run affected macOS a2a3sim host-build-graph group
        run: |
          .venv/bin/python -m pytest tests/st/a2a3/host_build_graph \
            --platform a2a3sim --device 0-15 -v \
            --pto-session-timeout 600 --require-pto-isa --manual exclude
