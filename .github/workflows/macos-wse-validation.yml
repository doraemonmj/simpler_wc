name: macOS WSE validation
on:
  push:
    branches: [ci/macos-wse-validation]
permissions:
  contents: read
jobs:
  wse:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "60000"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.10"
      - uses: ./.github/actions/setup-gcc-15
        with:
          install-graphviz: "true"
      - uses: ./.github/actions/cache-pip
      - uses: ./.github/actions/setup-venv
        id: setup
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_wsesim .[test]"
      - name: Change detection on system Bash
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          export PATH="$RUNNER_TEMP/system-bash:$PATH"
          bash --version
          .venv/bin/python -m pytest tests/ut/py/test_ci_base_resolution.py tests/ut/py/test_wse_change_detection.py -v --tb=short
      - name: WSE unit tests
        run: .venv/bin/python -m pytest tests/ut/py/test_wse*.py tests/ut/py/wse -v --tb=short
      - name: Rebased WSE admission, sync-start and shared-tile cases
        run: |
          .venv/bin/python -m pytest tests/st/wse/host_build_graph/test_admission.py \
            tests/st/wse/host_build_graph/test_recovery.py \
            tests/st/wse/host_build_graph/direct_launch/test_sync_start.py \
            tests/st/wse/host_build_graph/deployment/test_block_contract.py \
            tests/st/wse/host_build_graph/deployment/test_sram_ffn.py \
            tests/st/wse/host_build_graph/tile_operations/test_ffn.py \
            tests/st/wse/host_build_graph/tile_operations/test_execution.py::test_shared_state_between_threads_of_one_block \
            --platform wsesim --device 0-15 --max-parallel 1 --require-pto-isa --manual include -v

