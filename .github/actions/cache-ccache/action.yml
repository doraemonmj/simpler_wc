name: Cache ccache objects
description: Restore the per-runner ccache directory and optionally save it.

inputs:
  save:
    description: Save the updated cache after a successful job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure ccache
      shell: bash
      run: |
        # The directory is exported rather than left to ccache's own default
        # because that default moved between versions and differs by platform
        # (~/.ccache against ~/Library/Caches/ccache), while actions/cache needs
        # one literal path. Compression is what keeps the saved entry an
        # much smaller uploads than raw object files.
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

    - name: Restore ccache objects
      if: inputs.save != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ccache-

    - name: Restore and save ccache objects
      if: inputs.save == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ccache-
